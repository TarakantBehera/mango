
# --- Monitors ---
monitorrule=name:HDMI-A-1,width:1440,height:900,refresh:74.997,x:0,y:0,scale:1

# --- Window Effects ---
blur=0
blur_layer=0
blur_optimized=1

shadows=0
layer_shadows=0
shadow_only_floating=1

# --- Animations ---
animations=0
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1

# --- Scroller Layout ---
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0

# --- Master-Stack Layout ---
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# --- Overview ---
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0

# --- Input ---
# Keyboard: use `xkb_rules_layout` for your layout.
xkb_rules_layout=us
repeat_rate=35
repeat_delay=250
xkb_rules_options=caps:escape

mouse_accel_profile=1
mouse_accel_speed=0.45

sloppyfocus=1

cursor_hide_timeout=10
cursor_hide_on_keypress=1

# appearance
## borders
borderpx=4
gapih=0
gappiv=0
gappoh=0
gappov=0

## group
group_bar_height=10


#--- Layouts per Tag ---
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle





# --- Key Bindings ---
# System
bind=SUPER,r,reload_config
bind=SUPER,m,quit

# floating 
bind=SUPER,Space,togglefloating

# Applications
bind=SUPER,d,spawn,fuzzel
bind=SUPER,Return,spawn,foot

# Window Management
bind=SUPER,q,killclient
bind=SUPER,backslash,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER,a,togglemaximizescreen

# Focus
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,Tab,focusstack,next

# movement
bind=SUPER+SHIFT,left,move_client,left
bind=SUPER+SHIFT,right,move_client,right
bind=SUPER+SHIFT,up,move_client,up
bind=SUPER+SHIFT,down,move_client,down

bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,j,move_client,down

# Tags (Workspaces)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9

# dwindle
bind=SUPER,e,dwindle_toggle_current_split

# overview mode
bind=SUPER,o,toggleoverview

# bind:monitor
bind=ALT,p,sleep_toggle_monitor,HDMI-A-1

# group
bind=SUPER+ALT,h,groupjoin,left
bind=SUPER+ALT,l,groupjoin,right
bind=SUPER+ALT,k,groupjoin,up
bind=SUPER+ALT,j,groupjoin,down
## group focus
bind=SUPER,greater,groupfocus,next
bind=SUPER,less,groupfocus,prev
## group leave
bind=SUPER+ALT,c,groupleave

# Mouse Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

# --- Window Rules ---
